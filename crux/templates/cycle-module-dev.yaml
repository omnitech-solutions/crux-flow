# Cycle module: Dev loop (4 prompts) — YAML partial
#
# This module is a YAML fragment: a list of prompt mappings ({title, purpose, prompt,
# expected_output, side_effects, module_tag}) that `dev-cycle` concatenates
# into a book's `prompts:` array and then renumbers (`n: 1..total`). It is NOT
# a standalone book — it has no top-level keys, only the prompt list.
#
# Reusable building block for a cycle's development phase. One instance of this
# module produces one implementation, one round of quality gates, and one
# internal review. A cycle MUST have at least one dev module — internal review
# is the artifact-quality floor enforced by this module.
#
# Placeholder tokens (substituted INSIDE the scalar values at assembly):
#
# - `{M}` — dev-loop iteration label (`#1`, `#2`, ...). Omitted in
#   single-dev-loop cycles; otherwise the prompt title reads
#   `Develop (loop #M): ...`. (Prompt numbering is no longer a token —
#   `dev-cycle` assigns sequential `n:` after concatenation.)
# - `{SCOPE}` — short phrase describing what THIS dev loop implements. In a
#   single-loop cycle, this is "the accepted ADR" verbatim. In multi-loop
#   cycles, it disambiguates which slice of work this loop covers (e.g.
#   "the backend schema", "the LiveView UI", "the migration script").
# - `{RULE_REFS}` — one or more `rule:<slug>` citations this dev loop
#   implements, where the slug is the part of a rule's governs handle after
#   the slash (e.g. `rule:rule-slug-citation-token`). A dev loop that
#   implements several rules enumerates every citation. `iterate`, whose
#   cycle has no ADR, substitutes the verified Diagnosis + commit-approach
#   journal entry instead — the meaning is "what this loop implements", and
#   the citation is its ordinary shape. Substitute inside the block scalar
#   only: a `rule:` token opening a YAML line parses as a mapping key.
#
# `module_tag: dev-{M}` — every prompt in THIS module carries the same tag,
# where `{M}` is the 1-based occurrence of the dev module within the book
# (first dev loop → `dev-1`, second → `dev-2`, ...). NOTE: here `{M}`'s
# resolved value is the BARE integer (`dev-1`) — distinct from the title's
# `{M}` LABEL (`#1`). Substitute the integer, not the label: `dev-#1` is
# INVALID (schema pattern `^(adr|dev|review)-\d+$`). Replaces the retired
# `<!-- MODULE BOUNDARY -->` comments; makes the internal-review invariant
# checkable by counting `^dev-`-tagged elements.
#
# Invariant enforced by this module: every implementation is gated by quality
# checks AND an internal review BEFORE external review. A dev loop without
# those gates violates the cycle contract.

- title: "Develop {M}: derive an implementation plan for {SCOPE}"
  module_tag: dev-{M}
  purpose: |
    Convert the architectural commitment(s) into ordered work units.
  prompt: |
    Read governing architectural constraints and any selected formal implementation reasoning
    separately. An Implementation Decision supplies no rule or current-state authority.
    For a selected formal decision, compare delivery to the approved original and include annotations in
    independent review scope. Report approval, delivery and queried source state separately.
    Validate the committed approval binding and its retained context before
    treating reasoning as reviewed intent. Use the context's supported profile;
    book format supplies none. Preserve historical context bytes.
    Read the rules this loop implements: {RULE_REFS}. Resolve each citation
    through `docs/adrs/doctrine/index.md` to its rule and its ADR; read the
    ADR for the rationale. Produce an implementation plan scoped to {SCOPE}
    with:
      - Files to create / modify (paths)
      - Ordered work units (each ≤ ~200 LOC; each independently testable)
      - Risks specific to implementation (not architecture)
      - Quality gates: which tests, which linters, which static-analysis
        and security tools must pass before review.

    The plan is a working document — capture it in this run snapshot's
    Notes field under the label `Implementation plan {M}`. Do NOT write a
    separate ADR for the implementation plan; the architectural decision
    is already recorded.
  expected_output: |
    Implementation plan in this run's Notes; clear ordered work units.
  side_effects: []

- title: "Develop {M}: spawn implementation team"
  module_tag: dev-{M}
  purpose: |
    Implement the plan with parallel agents where independent.
  prompt: |
    Read governing architectural constraints and any selected formal implementation reasoning
    separately. An Implementation Decision supplies no rule or current-state authority.
    For a selected formal decision, compare delivery to the approved original and include annotations in
    independent review scope. Report approval, delivery and queried source state separately.
    Validate the committed approval binding and its retained context before
    treating reasoning as reviewed intent. Use the context's supported profile;
    book format supplies none. Preserve historical context bytes.
    Group the work units from this loop's planning prompt by independence.
    Dispatch one `Agent` per independent group in parallel. Each agent
    receives: the ADR(s), the implementation plan, its assigned work units,
    and explicit conventions from `docs/AGENTS.md`.

    Each agent also receives the book's `goal` statements — the Outcome, the
    Evidence, and the Constraint. A dispatch passes them forward verbatim, or
    narrows the Outcome and says so: a narrowed Outcome is entailed by its
    parent and names the parent it narrowed and what it dropped. The Evidence
    and the Constraint pass whole — a dispatch may add an Evidence item or a
    Constraint, saying which it added, and may drop neither. Record any
    narrowing in this run snapshot's Notes under the label
    `Outcome narrowing {M}` — never by editing the book.

    Each agent must make actual edits and run the relevant tests for its
    scope. Each returns: files changed, tests added/updated, test results,
    and any unilateral decisions with rationale.

    After all agents return, integrate. If two agents edited overlapping
    files (they should not have, given grouping), reconcile manually.

    Integrate commits only outside the tester's window. The tester's window runs
    from the tester's dispatch until the tester returns. The agent that dispatched
    the tester holds the window. While it is open, that agent commits nothing to the main checkout, convenes no council, runs no live-tree tool, and dispatches no agent that does. Every dispatch you make while the window is open says so. The run has one commit
    lane: no commit and no council while the tester's full suite or a live-tree
    tool (compile-doctrine.py, summarize-adrs.py, derive-arch.py,
    run-drift-gates.py, the council runner) runs.
  expected_output: |
    All work units implemented; per-agent reports collected.
  side_effects: []

- title: "Develop {M}: run quality gates; loop until clean"
  module_tag: dev-{M}
  purpose: |
    Verify the implementation passes every gate before review.
  prompt: |
    Read governing architectural constraints and any selected formal implementation reasoning
    separately. An Implementation Decision supplies no rule or current-state authority.
    For a selected formal decision, compare delivery to the approved original and include annotations in
    independent review scope. Report approval, delivery and queried source state separately.
    Validate the committed approval binding and its retained context before
    treating reasoning as reviewed intent. Use the context's supported profile;
    book format supplies none. Preserve historical context bytes.
    Run, in this order:
      - The repo's **full test suite** — the COMPLETE run (e.g.
        `python3 -m unittest discover -s crux/scripts/tests`, `mix test`,
        `pytest`), NOT a hand-picked subset of "the tests that look relevant".
        Capture the exact command from `docs/AGENTS.md` or root AGENTS.md.
        **The full run is mandatory whenever the change touches any shared or
        enumerated surface** — the agent roster, model/router config, the
        catalog, or anything a *different* file hardcodes a list or count of.
        Rationale: a stale hardcoded enumeration in a file the diff never
        touched is invisible to diff-review (you cannot see a missing edit by
        reading the edits that were made) and only fails when its own assertion
        runs — so the full suite is the only gate that catches it. Running a
        curated subset here is exactly the gap that shipped a red suite in a
        prior cycle.
      - The linter / formatter (e.g. `mix format --check-formatted`,
        `ruff check`, `eslint`).
      - Static analysis (e.g. `mix credo --strict`, `mypy`, `tsc --noEmit`).
      - Security analysis (e.g. `mix sobelow`, `bandit`, `npm audit`).
      - `verify-code-docs` — ensure no docstring drift was introduced.
      - **Release-content scan** — if the diff touches any distributed
        surface (`crux/skills/`, `crux/agents/`, `crux/templates/`), run
        `check-public-release-content.py` (the permanent release-content
        scan) so a banned internal-reference leak fails IN-CYCLE, not only at
        release time.
        Read its exit code as a gate, not a log line: **exit 0 = clean;
        exit 1 = FINDINGS** — one `<path>:<lineno>: <line>` row per hit on
        stdout, each a real gate failure to FIX by re-editing the offending
        surface (NOT an environment error — do not wave it through); a crash
        / **exit ≥ 2 / non-zero with empty or unparseable stdout = an
        environment-capability error** (surface stderr; a distinct lane, not
        a findings result).

    For any failure: fix it (re-edit code), then re-run the failed gate
    AND every subsequent gate. Repeat until all gates return clean. After
    3 full loops without convergence, STOP and escalate.

    The run's designated tester runs the full suite. No agent other than the tester
    or the dev-lead starts a full suite, and one full suite runs at a time. The
    historian records the Tester record in the run notes under `Tester record`: gate
    label, command, HEAD, clean-tree status at start and end, result tokens and wall
    time. The quality-gate run carries the gate label `--gate
    <book-id>/<run-id>/p<N>/quality-gate`. Gate labels come from the closed set
    `integration`, `quality-gate`, `exit`. `<book-id>` is the book's `id` field (for
    example `PB-0144`), and `<run-id>` is the run's `run_id` (for example
    `RUN-001`). A cycle run labels its integration run `quality-gate`. `exit` labels the full suite at the exit
    gate before merge is offered. `integration` labels an integration full suite in
    a book that has no quality-gate prompt. Per-unit runs pass no `--gate` and are
    never reusable. Before re-running a gate's full suite, the tester may pass
    `--reuse` with that gate's label: the full-suite runner reports the matching
    record and starts no second run, and otherwise runs the suites. A record for another gate never matches `--reuse` for this one. A project whose full-suite runner takes no `--gate` or
    `--reuse` option still names the gate label in the Tester record and runs the
    suite each time. While the tester's full suite or a live-tree tool runs, no
    agent commits and no council convenes.

    **Record each gate in the run snapshot Notes with its exact command AND
    a concrete result token** (e.g. `validate-catalog --dry-run → exit 0`,
    `unittest → 149 OK`) — NOT a bare "all gates green". The review module's
    dev-practice conformance reviewer corroborates these tokens
    against the diff; an unrecorded gate reads as fabrication-by-omission (a
    Tier-1 conformance FAIL).
  expected_output: |
    All gates green; each gate's command + result token captured in the run
    snapshot Notes.
  side_effects: [verify-code-docs]

- title: "Develop {M}: internal review"
  module_tag: dev-{M}
  purpose: |
    First-pass self-review before external eyes.
  prompt: |
    Read governing architectural constraints and any selected formal implementation reasoning
    separately. An Implementation Decision supplies no rule or current-state authority.
    For a selected formal decision, compare delivery to the approved original and include annotations in
    independent review scope. Report approval, delivery and queried source state separately.
    Validate the committed approval binding and its retained context before
    treating reasoning as reviewed intent. Use the context's supported profile;
    book format supplies none. Preserve historical context bytes.
    Precondition: This review requires the Tester record from this module's
    quality-gate prompt. It holds when
    `git merge-base --is-ancestor <recorded HEAD> HEAD` exits 0, every path printed
    by `git diff --name-only <recorded HEAD> HEAD` lies under a bookkeeping path,
    and `git status --porcelain --untracked-files=all` is empty. The bookkeeping
    paths are the run directory, the run's own book file, `<docs_dir>/log.md` and
    `<docs_dir>/journal/`. The book file counts only while its frozen-plan hash
    equals the run's `book_content_hash`; compare them with audit-docs CHK-PB-BIND,
    or compute_book_hash from `${CRUX_PLUGIN_ROOT}/scripts/validate-promptbook.py`.
    The frozen-plan subset excludes the run-state fields `current_run`,
    `current_prompt`, `status` and every key outside the plan subset. Name the
    result in the run notes. This is citation, never a substitute for the
    integration run, the exit gate or a release gate. When any precondition check
    fails, the run stays at this prompt: no advance-run route returns it to the
    quality-gate prompt. When `git status --porcelain --untracked-files=all` is not empty, the conductor first commits the run's own changes. It names every other path to the owner and stops; it deletes nothing. Then the conductor has the tester re-run the full suite of this module's quality-gate prompt, the historian records the new Tester record, and
    the checks run again.
    Invoke the `code-review` skill (use the default effort level, no
    `--comment` flag — this is a private dry-run). The skill produces a
    ranked list of findings scoped to the diff this dev loop produced.

    For each `CONFIRMED` finding, fix in place. For each `PLAUSIBLE`,
    evaluate and decide. Do NOT exit this module until every `CONFIRMED`
    finding is resolved or explicitly deferred with rationale captured in
    the run snapshot Notes under `Dev loop {M} review deferrals`. When the fixes in
    this prompt touch any path outside the bookkeeping paths, the tester runs a new
    full suite under this module's quality-gate label at the post-fix HEAD, and the
    historian records it as a new Tester record, before the review module cites one.
  expected_output: |
    Internal-review findings list and resolutions.
  side_effects: []
