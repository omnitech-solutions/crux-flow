  - n: 11
    title: "Review: implement feedback; loop until clean"
    module_tag: review-1
    purpose: |
      Address all review findings before PR.
    prompt: |
      Read governing architectural constraints and any selected formal implementation reasoning
      separately. An Implementation Decision supplies no rule or current-state authority.
      For a selected formal decision, compare delivery to the approved original and include annotations in
      independent review scope. Report approval, delivery and queried source state separately.
      Validate the committed approval binding and its retained context before
      treating reasoning as reviewed intent. Use the context's supported profile;
      book format supplies none. Preserve historical context bytes.
      Combine the Prompt 9 + 10 findings (quality, security, conformance). Fix
      every MUST-FIX (dispatch fix `Agent`s or fix directly); document
      SHOULD-CONSIDER deferrals in `notes`. A fix dispatch is an assignment: it
      carries the finding, the book's Outcome and Constraint, and the Evidence
      item the finding bears on. Narrow the Outcome to the finding and say what
      the narrowing dropped; pass the Evidence and the Constraint whole. A fixer
      that is told only what is broken optimizes for the gate rather than for the
      user the fix is meant to serve. Re-run the Prompt 7 gates; if green
      AND re-dispatched reviewers report zero MUST-FIX, advance to Prompt 12.
      Otherwise loop to Prompt 9. After 3 review-fix loops without convergence,
      STOP and escalate.

      Where you fixed a MUST-FIX yourself rather than dispatching it, that
      fix is your own authorship: the re-review of it is commissioned by
      your delegator, not by you, and you re-dispatch only the reviewers of
      work you did not write. At the top of the chain the delegator is the
      human who approved the run.

      **Forge-log `used` recording (on this module's CONVERGED EXIT only).**
      When this pass is the one that advances OUT of the module (NOT on each
      fix-loop iteration — per-pass recording would triple-count a single use),
      then for **each distinct forged skill this review module invoked** (a
      `.claude/skills/<name>/` skill run during any of this module's review or
      fix passes), do BOTH: write one forge-log `used` entry conforming to
      forge-skill's locked format (the forge-skill-validated slug `<name>`, an
      outcome token `ok` or `partial`, with the `(same-session)` suffix when
      the skill was forged this same session — so `ok (same-session)` /
      `partial (same-session)`); AND append one line to the run-snapshot Notes
      section `Forged skills used` of the form `<skill-name> | <prompt n> |
      <outcome-token>`. If this module invoked NO forged skill, write nothing —
      a clean no-op. Injection/secret safety is INHERITED from forge-skill's
      locked format (validated slug cannot contain `|`/`[`/newline; finite
      outcome enum; single-line secret-free body) — do not reinvent it.
    expected_output: |
      Clean review cycle; quality gates still green. On converged exit, one
      forge-log `used` entry + one `Forged skills used` Notes line per distinct
      forged skill invoked (or a clean no-op if none).
    side_effects: [forge-skill]

  # --- Fixed prep + summary (2 prompts) — inline; NO module_tag ---
  - n: 12
    title: "Prep: changelog, docs, journal, PR notes"
    purpose: |
      Make the fix shippable to humans.
    prompt: |
      1. **Changelog**: update the repo-root `CHANGELOG.md` `## [Unreleased]` with
         a 1–3 line entry. Link the verify journal entry / the fixed issue.
      2. **Documentation**: run `audit-docs`; address every BROKEN finding. If the
         fix changed a documented contract, update `docs/AGENTS.md` (and the
         `AGENTS.md.tmpl` twin) in lock-step.
      3. **Journal**: invoke `log-work` with a reflective entry — what the fix
         was, what the reproduction taught you, what to watch for next time.
      4. **Prose review**: run `prose-review` over the prose this prompt just
         wrote — the changelog entry, any doc edits, the journal entry, and
         the PR body. Apply every `fix` finding; resolve each `confirm`
         finding by supplying the fact or dropping the claim. Advisory here;
         the release gate is where they bind.
      5. **PR notes**: draft a PR body (do NOT open the PR) — Summary, the verified
         root cause, Test plan (incl. the regression test), Risk notes. Store it
         in the run snapshot's `pr_draft` field.
      6. **Result record**: skip this item when the run's
         `implementation_bindings` is empty. Otherwise, wait until the review
         reports are committed. Then write one evidence file per
         `implementation_bindings` entry in this run's directory. The shape is
         defined by `${CRUX_PLUGIN_ROOT}/schemas/implementation-result.schema.json`;
         `${CRUX_PLUGIN_ROOT}/templates/implementation-result-template.yaml` is an example.
         Mark `delivery_state: complete` only when every decision scope entry is
         covered and every file changed under the scope between
         `preimage_revision` and `source_revision` is listed; otherwise mark it
         `partial` when part of the scope was delivered, or `unimplemented` with empty
         `scope` and `sources` when none was. Then run `uv run "${CRUX_PLUGIN_ROOT}/scripts/implementation-decisions.py"
         result --decision <the entry's revision.path> --evidence <evidence file>`.
         Commit the evidence file and the result record at the `written` path the
         command prints, each by explicit path.
         Record any `refused` code the result command prints in the run notes.
    expected_output: |
      CHANGELOG updated; docs clean per audit-docs; journal entry; PR draft stored;
      a result record per implementation binding, or none when
      implementation_bindings is empty.
    side_effects: [audit-docs, log-work]

  - n: 13
    title: "Summary: completion report AND archive the book"
    purpose: |
      Hand off cleanly AND close the cycle's tracked artifact inside its own
      final prompt.
    prompt: |
      **Forge-log `evaluated` fold (before/at archival).** Read the run-snapshot
      Notes section `Forged skills used`. For **each DISTINCT forged skill name**
      in that section, write exactly ONE forge-log `evaluated` entry (one per
      distinct skill, NOT one per use / per review pass — the structural defense
      against K-fold duplicate entries that would inflate the promotion floor's
      distinct-dates signal), conforming to forge-skill's locked two-line
      `evaluated` format. Derive the `verdict` from that skill's recorded outcome
      tokens, ignoring any `(same-session)` suffix (treat `ok (same-session)` as
      `ok` and `partial (same-session)` as `partial`):
      all `ok` → `effective`; any `partial` → `mixed`. Write a
      `fell-short` verdict ONLY when this session judges the skill genuinely
      failed its task (a qualitative judgment, NOT derived from the `ok`/`partial`
      outcome tokens — it routes the skill to forge-skill's revise condition). If
      the `Forged skills used` section is empty (no forged skill used in this
      cycle), write nothing — a clean no-op.

      Write a completion summary to the run snapshot's `summary` field:
      one-paragraph outcome; links (the verify journal entry, CHANGELOG entry,
      this run); stats (prompts, council rounds, dev gate loops, review-fix loops,
      files changed, tests added); outstanding deferred work; and the `pr_draft`
      text. THEN run `uv run "${CRUX_PLUGIN_ROOT}/scripts/advance-run.py"
      <run-RUN-NNN.yaml> --outcome done --result "summary written; archiving
      next" --book <book.yaml>`. This prompt's `result` records
      the hand-off, NOT "book archived" — the archive has not happened yet at
      the instant that string is written. The run reaches `status: completed`,
      `current_prompt` is nulled on both book and run, and the book's
      `current_run` SURVIVES. THEN invoke `archive-promptbook PB-NNNN` to
      finalize (moves to `archive/`, sets `status: archived`, nulls
      `current_run`/`current_prompt`, writes the archive note + the
      `promptbook | archived` log entry). Do NOT manually null
      `current_run`/`current_prompt` first — archive-promptbook reads
      `current_run`. Prep already journaled; archive does not re-journal. The
      archive act itself is recorded in the archive note and the
      `promptbook | archived` log entry, never in a prompt `result`.
    expected_output: |
      Completion summary written; one forge-log `evaluated` entry per distinct
      forged skill used in the cycle (or a clean no-op if none); book archived;
      `promptbook | archived` log entry.
    side_effects: [archive-promptbook, forge-skill]
