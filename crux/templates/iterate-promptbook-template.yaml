  # --- Review module #1 (3 prompts) — from cycle-module-review.yaml, module_tag review-1 ---
  - n: 9
    title: "Review: external team review (multi-dimension + dedicated security review)"
    module_tag: review-1
    purpose: |
      Independent verification of correctness, consistency, clarity, and security.
    prompt: |
      Read governing architectural constraints and any selected formal implementation reasoning
      separately. An Implementation Decision supplies no rule or current-state authority.
      For a selected formal decision, compare delivery to the approved original and include annotations in
      independent review scope. Report approval, delivery and queried source state separately.
      Validate the committed approval binding and its retained context before
      treating reasoning as reviewed intent. Use the context's supported profile;
      book format supplies none. Preserve historical context bytes.
      Dispatch parallel `Agent` reviewers, each blind to the others, scoped to the
      full cycle diff. **Three quality dimensions:** (a) Correctness — re-run the
      Prompt 7 gates except the full test suite, for which check the Tester
      record, then read the diff for behavior bugs + confirm the fix
      actually resolves the diagnosed root cause; (b) Consistency — vs ADRs,
      `docs/AGENTS.md`, adjacent patterns; (c) Clarity. No reviewer starts a full suite; reviewers cite the Tester record. **PLUS a dedicated
      multi-subagent security review** — one `Agent` per threat class (S1
      injection, S2 secrets incl. `~/.crux/`, S3 authz, S4 supply-chain, S5
      unsafe file/shell/resource), scope-adaptive with MANDATORY N/A reports. A
      `[SECURITY:Sn]` finding on a reachable path is non-downgradable MUST-FIX.

      Commission these reviewers yourself for the units you dispatched.
      Where you integrated across those units, that integration is your own
      authorship, so its review is commissioned by your delegator and not by
      you.

      Every reviewer receives the book's `goal` statements — the Outcome, the
      Evidence, and the Constraint. Each judges the change against the Outcome
      rather than against the diff alone.
      Each returns one disposition per Evidence item:
        - verified, with the command and the result token, or the observation
          and where it is recorded when no command produced it;
        - contradicted, which is a finding;
        - unobserved, with what was attempted, what limited it, and what
          would settle it.
      Each states whether the Constraint held and what shows that. A result
      token is an exit code, a pass count, or a named verdict — never raw
      output, an environment value, or a secret.
      A disposition is re-derived, never adopted from the author's report:
      an item stands verified only where this reviewer ran the command and
      read the result token, or re-read the observation where it is
      recorded; anything it cannot re-derive is unobserved in its own report.

      **The independent-review gate.** This prompt advances only with reviewer
      reports attached (rule:review-gate-needs-a-reviewer-report). Commit the
      work, then fix the reviewed range as
      `<the run's base_commit>..<HEAD at dispatch>`. The gate check does not
      compare the base, so hold it. Each reviewer writes its own
      report: `uv run "${CRUX_PLUGIN_ROOT}/scripts/write-review-report.py"
      <run-RUN-NNN.yaml> --prompt <n> --range <base>..<end> --verdict
      '<verdict>'`, adding one `--finding '<finding>'` per finding. Single-quote
      each value and write an embedded `'` as `'\''`; never put model-written
      text inside double quotes. Text with quotes or several lines goes in a
      file passed with `--verdict-file` or `--finding-file`. A reviewer whose
      harness grants no shell returns those fields, and the agent that
      commissioned the review runs the writer with them. From the range end to
      the advance, write nothing to the run snapshot or the book: the range
      covers both, so a later write to either refuses every report. Commit only
      the reports before the advance: a commit after the range end that changes
      a reviewed path refuses every report. Record notes, deferrals and gate
      tokens after the advance. Attach every report with `--artifacts`. A
      council record never satisfies this gate.
    expected_output: |
      Aggregated external-review + security findings, plus a disposition
      per Evidence item.
    side_effects: []

