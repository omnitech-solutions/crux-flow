# Canonical 1×verify + 1×dev + 1×review iterate cycle (13 prompts) — full YAML book skeleton.
#
# An `iterate` book is a cycle book with `cycle_kind: verify`: it swaps the ADR
# module for a VERIFY module (research/reproduce/root-cause + council review of
# the diagnosis), for NON-architectural reactive work (bug fixes, drift
# remediation, refinements to existing behavior). This file is the default
# assembly `iterate` emits for the minimum cycle (V=D=R=1): the top-level keys
# below plus the assembled `prompts:` list with sequential `n: 1..13`.
#
# For cycles with additional modules, `iterate` concatenates the YAML prompt-
# lists from cycle-module-{verify,dev,review}.yaml (verify modules, then dev
# modules, then review modules), appends the two fixed prep + summary prompts,
# then assigns sequential `n:`.
#
# Invariants enforced (machine-checked by validate-promptbook.py's cycle-coverage
# pass):
#   1. total_prompts >= 13
#   2. Every verify module has a paired council prompt (count `^verify-` tags)
#   3. Every artifact has a review cycle (count `^review-` tags)
#   4. cycle_kind: verify <-> modules {verify,dev_loops,review_cycles} <-> only
#      verify-/dev-/review- module tags (no adr- tags — adr/verify XOR)
# total_prompts == 4*verify + 4*dev_loops + 3*review_cycles + 2.

format_version: "2"
id: PB-NNNN
title: "Iterate: <bug, drift, or refinement to existing behavior>"
status: active
created_at: YYYY-MM-DD
total_prompts: 13
current_run: null
current_prompt: null
forked_from: null
tags: [cycle, workflow, iterate]
cycle_kind: verify
modules:
  adrs: 0
  implementations: 0
  verify: 1
  dev_loops: 1
  review_cycles: 1

# Declare a slot before start for each formal Implementation Decision. Empty means incidental choices only.
implementation_slots: []

goal: |
  <One paragraph: the bug / drift / refinement being fixed through this iterate
  cycle. Open it with three statements: the Outcome — what improves for the
  affected user when the work is done; the Evidence — what would demonstrate
  that improvement; and the Constraint — what the change must preserve. Prose
  in this field: no new field, no form, no gate. NON-architectural by definition —
  if it needs a new architectural decision, the verify council routes it to
  `dev-cycle`. End-state: a reviewed, tested, documented PR ready for human
  merge.>

strategy: |
  Drive a single non-architectural fix through the iterate cycle: verify
  (reproduce + root-cause + council-review the diagnosis), develop (implement +
  quality gates), review (external + test/doc audit + fixes), prep (changelog +
  docs + journal + PR notes), summarize. Each phase has an internal loop with
  explicit exit criteria; 3-round non-convergence escalates.

  Skills exercised: `query-docs`, `council`, `log-work`, `code-review`,
  `verify-code-docs`, `audit-docs`, plus the `Agent` tool for parallel dispatch.
  The council runs through the council runner (`run-council.py`). `srde` is
  evidence only and never settles the council gate.
  Out of scope: net-new/architectural features (use `dev-cycle`); cutting a
  release tag; merging the PR.

run_autonomy: |
  Both book formats execute with the current attempt-aware gate. New councils use
  council-record format two and attempt format one. New formal closes retain gate
  context three/profile four; historical context two/profile three and context one/profile two remain replay-only.
  Finish any open Git merge or other sequence before council. The runner or
  recovery alone commits attempt/result evidence; the historian commits run closes.
  After each initial or revised formal revision or migration-batch subject write,
  immediately record its bytes before committing it:

    uv run "${CRUX_PLUGIN_ROOT}/scripts/run-work-witness.py" record <run-RUN-NNN.yaml> --prompt <n> --path <subject-path>

  Never create a witness after a refusal. Repair only authorized preflight causes.
  A persistence failure permits request-free recovery, never repeat deliberation.
  Once this cycle's run is started, it runs to completion without human review.
  Questions and decisions are resolved by the council runner for a council
  gate, and by dispatched `Agent`s otherwise. The only stops are (a) a module escalation loop firing (3-round
  non-convergence on council, quality gates, or review fix-loop; or the
  preflight retry sequence, a third preflight refusal at one convening
  prompt), (b) the verify
  council's "this is actually architectural -> use dev-cycle" escape verdict,
  (c) a council that cannot run through the council runner yields
  DEFER_TO_HUMAN, and (d) a genuinely irreversible/outward-facing action the
  plan did not authorize (push/merge, deploy, external send, data deletion, spend). In-repo
  edits — including `docs/AGENTS.md`, skill files, and code — are never stop
  points. See `docs/AGENTS.md` §11 "Run execution autonomy" for the full
  contract.

prompts:
  # --- Verify module #1 (4 prompts) — from cycle-module-verify.yaml, module_tag verify-1 ---
  - n: 1
    title: "Verify: research & reproduce the issue"
    module_tag: verify-1
    purpose: |
      Establish that the issue is real and understood before any fix lands —
      the iterate cycle's substitute for an ADR (a verified diagnosis, not a
      decision).
    prompt: |
      Read the goal above. Invoke `query-docs` for relevant ADRs/briefs/research/
      journal. Dispatch 2–3 research agents in parallel: each returns a
      reproduction (steps / failing test / concretely-cited drift, not a vague
      description), the root cause (cause vs. symptom), the scope, and a proposed
      MINIMAL remediation approach.

      Reproduce at the run's `base_commit`, and record that commit in the
      Diagnosis. Name each reproduction's kind. A textual reproduction quotes
      text and reads it at the base with `git show <base_commit>:<path>`. An
      executed reproduction runs code, a test or a command, and runs against the
      base tree. The working tree stands in for the base tree only when
      `git diff --quiet <base_commit> -- <paths>` exits 0 and
      `git ls-files --others --exclude-standard -- <paths>` prints nothing,
      where `<paths>` covers every input the reproduction reads: the code under
      test, what it imports, its fixtures and configuration, and the test
      itself. Equal files prove nothing about inputs the list leaves out. When
      the check fails, run the reproduction in a private worktree,
      `git worktree add --detach <private scratch path> <base_commit>`, never
      under a shared `/tmp` path, and remove it afterwards. When a reproduction
      cannot run at the base, record that as a stated limit of the evidence,
      never as a reproduction. When `base_commit` is null, say so and record the
      commit you used.

      Synthesize into a `Diagnosis` block in this
      run snapshot's `notes`. Do NOT write an ADR; if the work turns out to be
      architectural, the council's escape verdict (next) routes it to `dev-cycle`.
      The snapshot is a later council subject. Immediately after each diagnosis
      write, record its bytes before committing it:

        uv run "${CRUX_PLUGIN_ROOT}/scripts/run-work-witness.py" record <run-RUN-NNN.yaml> --prompt <n> --path <run-RUN-NNN.yaml>

      A later advance changes snapshot bytes; it does not renew this witness.
    expected_output: |
      A `Diagnosis` block in the run `notes`: reproduction/evidence, root cause,
      scope, proposed minimal approach, the `base_commit` the reproduction ran at,
      each reproduction's kind (textual or executed), and any stated limit.
    side_effects: [query-docs]

  - n: 2
    title: "Verify: convene LLM council to review the diagnosis"
    module_tag: verify-1
    purpose: |
      Gate the diagnosis + approach with multi-perspective review before any code
      lands — the same rigor `dev-cycle` applies to an ADR, applied to a fix.
    prompt: |
      For a formal Implementation Decision, declare this verify module's slot before
      start and select the approach before council. Author the exact decision
      revision alongside the diagnosis. After each initial or revised write, record:

        uv run "${CRUX_PLUGIN_ROOT}/scripts/run-work-witness.py" record <run-RUN-NNN.yaml> --prompt <n> --path <decision-path>

      Then commit that revision. Never create a witness after a preflight refusal.
      Add --implementation-revision
      <decision-path> --subject <decision-path> --retain-subjects to each council.
      The question names its exact path and digest, retains all five diagnosis
      dimensions, and explicitly assesses architectural conflict for that approach.
      Diagnosis-only approval cannot approve a formal Implementation Decision.
      Use the exact question names Evidence/Reproduction, Root-cause correctness,
      Approach soundness and minimality, Consistency and Security.

      Council deliberation runs only through the council runner,
      `run-council.py`, and its council record is the only evidence this gate
      accepts (rule:council-gate-needs-a-runner-record). A reviewer report never
      satisfies this gate, and no reviewer subagent casts a seat's vote
      (rule:council-is-never-harness-native).

      Convene a round over the `Diagnosis` block:
        (a) Run the gate-information query and follow any correction notice
            it prints: `uv run "${CRUX_PLUGIN_ROOT}/scripts/advance-run.py"
            <run-RUN-NNN.yaml> --book <book.yaml> --gate-info --prompt <n>`.
        (b) Commit the run snapshot that carries `Diagnosis`. The council
            runner reads only a subject that is tracked and unchanged.
        (c) Write the question to
            `<run_dir>/council/<RUN>-p<n>-r<round>-question.md`. It states the
            five dimensions below with their sub-questions, says that every seat
            assesses every dimension (rule:every-seat-assesses-five-dimensions),
            and states the escape verdict: a seat that finds the work needs a new
            decision votes `ARCHITECTURAL`. The council runner appends the vote
            instruction. From round 2 on, the question also carries the open
            blocking findings of the round before.
        (d) Run, as a background command, `uv run
            "${CRUX_PLUGIN_ROOT}/scripts/run-council.py" <run-RUN-NNN.yaml>`
            with `--prompt <n>` (the number of this council prompt),
            `--round <round>`, `--question <question-file>` and
            `--subject <run-RUN-NNN.yaml>`. `<round>` is the number of council
            records with outcome `ran` already in this module, plus one. A
            could-not-run record takes no place, so after you fix its cause you
            reconvene with the same number. Exit 0: the council ran, and the
            council runner committed its record. Exit 1 with a record: the
            council runner committed it, and the gate will stop on it. Exit 1
            with `"refused": "round"` and `"record": null`: `run-council.py`
            refused a `--round` that differs from that number, before any call,
            and wrote nothing; correct it and run again. Exit 1 with `"refused": "prompt"` and `"record": null`: `--prompt` was not the run's current prompt; run again with the current prompt or omit `--prompt`. Exit 1 with `"refused": "preflight"`: follow the preflight paragraph below. Exit 1 with `"refused": "attempt-open"`, exit 2, or a council runner that ended without an exit code or with a code other than 0, 1 and 2: follow the recovery paragraph below.

      **The council runner commits.** The council runner commits the attempt
      record and the council record itself. It commits the attempt record before
      any council request (rule:an-open-council-attempt-stops-the-gate). It
      verifies that each commit holds the bytes it computed
      (rule:council-evidence-matches-its-attempt). You commit no council record.

      **Preflight refusal.** Exit 1 with `"refused": "preflight"` and
      `"record": null` is a preflight refusal, raised before any council
      request. No council record was written, and nothing was committed. Each
      cause names its repair.
      For `retype`, correct the `--question` or `--subject` path. For
      `commit-run-work`, the subject is a file this run wrote and recorded with
      the witness writer; commit exactly that path:

        uv run "${CRUX_PLUGIN_ROOT}/scripts/run-work-witness.py" commit <run-RUN-NNN.yaml> --path <subject path>

      Then run the council runner again. If the witness writer refuses the
      commit with `"refused": "commit"`, git refused, and its `code`
      decides. For `index-locked`, the commit checked the lock before it
      staged anything: wait for any git command this run started to finish,
      then run the witness commit once more, which spends no council retry.
      When the lock persists, it is stale: report a contradicted-premise
      stop for the owner. For every other code (`sequence-in-progress`,
      `hook-or-commit-failed`, `timeout`, `mismatch`), report a
      contradicted-premise stop for the owner, and do not run the council
      runner again, which would spend a retry. When the refusal's `code` is
      `timeout`, or it carries `moved`, the owner restores the set-aside
      work first (`git stash list`, or a pre-commit framework's backup
      patch), then removes a stale `index.lock` in the git directory. A
      `mismatch` may follow a landed commit: the owner checks `git log` for
      the path. A refusal of `invalid` is the owner's too: report the same
      stop. For `missing` or a path refusal, correct the path and commit
      again. The refusals `unattributed`, `unwitnessed`, `witness-mismatch`,
      `mixed`, `council-path`, `witness-invalid` and `witness-binding` have
      no repair: run the council runner again, and it records
      `preflight-needs-owner`. The bound is three refusals at this prompt:
      the third commits a could-not-run record with the code
      `preflight-retries-spent`, and the run takes stop 1
      (rule:only-a-preflight-refusal-is-retried).

      **Recovery.** Start recovery when exit 2 means no committed council
      record exists and stderr names a claimed attempt, when the council runner
      refused with `"refused": "attempt-open"`, or when the council runner
      ended without an exit code or with a code other than 0, 1 and 2. When the
      exit-2 stderr names `timeout`, or names outside work the commit moved,
      the owner's remedy comes before recovery: report a contradicted-premise
      stop for the owner. The owner first restores the set-aside
      work (`git stash list`, or a pre-commit framework's backup patch) and
      then removes a stale `index.lock` in the git directory. Start recovery
      only after the owner reports both steps done. Run the process check:
      confirm that no council runner you started for this module is still
      running. Then probe the attempt's lock. While a council runner is live,
      wait. Pass `--prompt <n>` to the probe and to recovery. Without it,
      recovery cannot recognise a record whose pending copy is already removed,
      and it reports `nothing-open`:

        uv run "${CRUX_PLUGIN_ROOT}/scripts/run-council.py" --recover <run-RUN-NNN.yaml> --prompt <n> --probe

      When the probe reports `"lock": "unknown"`, treat it as a live council
      runner: wait and probe again. When it persists although no council runner
      runs, report an environment fault as a contradicted-premise stop for the
      owner. When the lock is free, run recovery: the same command without
      `--probe`. Recovery makes no council request and reads no key
      (rule:recovery-never-deliberates-again). On `recognised` or `committed`,
      read the record it names as its exit code says. On `released`, the claim
      made no request. When the council runner's exit 2 named `index-locked`,
      or it was killed before it reported, run the council runner again at the
      same round now: that is no reconvening. When `index-locked` persists
      across that one rerun, the lock is stale: report a contradicted-premise
      stop for the owner. When its exit 2 named another code
      (`hook-or-commit-failed`, `sequence-in-progress`, `timeout` or
      `mismatch`), the cause is the owner's: report a contradicted-premise
      stop, and run the council runner again at the same round once the owner
      fixes it. When that exit 2 named `timeout` or moved work, the owner's
      remedy order above came first. On `live-runner`, wait and probe again. On
      `nothing-open`, no attempt is open: report the exit 2 cause. After a
      council runner that ended without an exit code or with a code other than
      0, 1 and 2, nothing was claimed and no round was spent: run it again at
      the same round. On `index-locked`, wait for any git command this run
      started to finish, then run recovery again; never delete
      `.git/index.lock`. After `commit-refused` with `"commit_landed": true`,
      follow that branch before any open-attempt step. For code `timeout`, or a
      report that carries `outside_moved`, report a contradicted-premise stop
      for the owner. Once the owner has restored the set-aside work
      (`git stash list`, or a pre-commit framework's backup patch) and then
      removed a stale `index.lock` in the git directory, run recovery once
      more. For `mismatch`, a hook altered the record: the owner fixes it, and
      you run recovery with `--owner-commit-pending` at the owner's
      instruction. For any other code, run recovery once more at once. A
      `commit-refused` report names the outside paths the commit found changed
      as `outside_moved` and the owned paths it left staged as `owned_staged`.
      The marker `<outside state not compared>` in `outside_moved` means the
      commit could not compare the outside state: check `git status` and
      `git stash list`. On `mismatch`, `unproven`, a `commit-refused` that did
      not land, a persisting `index-locked` or a landed branch that recovery
      leaves open, the attempt stays open: advance `--outcome blocked` with the
      attempt record attached (stop 4). When HEAD does not hold the attempt
      record, the gate refuses that advance: this prompt cannot advance, so
      report why, a stop 4 for the owner. When recovery exits 2, it names an
      environment fault: report a contradicted-premise stop for the owner, who
      fixes the environment. Never convene a replacement round over an open
      attempt, and never before recovery reports; a persistence failure is
      never a reason to convene another round. When exit 2 names no attempt,
      nothing was claimed: this prompt cannot advance; report why.

      When the book was authored with `--deep-review`, round 1 also passes
      `docs/adrs/index.md`, every ADR the diagnosis cites and `docs/AGENTS.md` as
      a `--subject`, each tracked and clean; that round counts like any other.

      The five dimensions, over the diagnosis, each assessed by every seat:
        (1) Evidence/Reproduction — is the issue actually demonstrated (repro
            steps / failing test / concretely-cited drift), not asserted?
        (2) Root-cause correctness — is the diagnosed cause the real cause, or a
            symptom? Would the proposed fix actually resolve it?
        (3) Approach soundness + **minimality** — is it the smallest correct
            change? Any scope creep (refactors, features) that doesn't belong in
            a fix? Regression risk?
        (4) Consistency — does the approach fit existing behavior, ADRs, and the
            conventions in `docs/AGENTS.md`?
        (5) **Security** — does the fix introduce a security risk (new attack
            surface, secret/credential handling incl. `~/.crux/`, injection/
            authz, supply-chain/external-fetch)? `REQUEST_CHANGES` if unmitigated.

      **Escape verdict (the iterate-specific stop).** A seat that concludes the
      work is ACTUALLY ARCHITECTURAL — it requires a new decision, not a fix —
      votes the token `ARCHITECTURAL`. The gate check reads that vote as stop 4,
      a `docs/AGENTS.md` §11 run-autonomy **premise-contradiction stop**. Mark
      this prompt `blocked` (`--outcome blocked` with the record in
      `--artifacts`) and **escalate to the user**, recommending they abandon
      this `iterate` run (`run-promptbook abandon PB-NNNN --reason "<why>"`) and
      start a `dev-cycle` whose book cites this one in prose. The verify journal
      entry + the diagnosis persist as a `learning` the new `dev-cycle`'s ADR
      can cite. Do NOT silently convert or proceed.

      A council that cannot run through the council runner (no key, a refused
      seat assignment, fewer than three providers, no quorum) yields
      DEFER_TO_HUMAN (rule:only-a-preflight-refusal-is-retried). So does a
      subject outside your authority to repair, code `preflight-needs-owner`.
      The council runner has committed the record it wrote. Attach it with
      `--outcome blocked`; the run stops at the same stop 4. The code
      `preflight-retries-spent` stops it at stop 1 instead. No reviewer subagent
      takes a seat.

      The council runner's exit code and the record's `outcome` decide the
      contradicted-premise stop: exit 1 with `outcome: could-not-run` and any code but
      `preflight-retries-spent`, or a record that ran whose `refusal_reason` names the
      secret scan. The aggregate action
      DEFER_TO_HUMAN does not decide it, because a council that ran carries that
      action on a SPLIT or on low confidence, for example.

      `srde` is evidence and never settles this gate. A dissent it resolves
      enters the next round's question, and that dissent keeps blocking until a
      council round converges without it.

      Attach the committed council record with `--artifacts`: the gate reads
      only a committed record and refuses the advance, writing nothing, when it
      is not. The gate check reads each
      seat's decision, never the aggregate label
      (rule:convergence-is-derived-per-seat). A `pass` verdict allows
      `--outcome done` and refuses `--outcome blocked`. A record that did not
      converge advances with `--outcome blocked` and `--artifacts`; `--outcome
      done` is refused on any verdict other than `pass`. A `route` verdict
      returns the run to this module's address-findings prompt for the next
      round, and a `stop` verdict keeps the run here for the user. The bound is
      three council rounds, with no adjudicator. This prompt closes only on convergence
      (rule:council-gate-advances-on-convergence-or-refutation).
    expected_output: |
      The council record's path attached; per-seat decisions and blocking
      findings listed from it; the architectural-escape stop if it fired.
    side_effects: [council]

  - n: 3
    title: "Verify: address council findings, re-convene the council"
    module_tag: verify-1
    purpose: |
      Close the diagnosis loop until the council converges on the fix approach.
    prompt: |
      If a formal revision's reasoning changes, retain the earlier revision and
      author a new revision. Immediately record its write before committing it:

        uv run "${CRUX_PLUGIN_ROOT}/scripts/run-work-witness.py" record <run-RUN-NNN.yaml> --prompt <n> --path <decision-path>

      Commit the revision before reconvening. Resolve any open attempt first.
      The latest deciding receipt must itself retain the selected revision;
      earlier-round inclusion is insufficient.

      For each blocking finding in the latest council record (Prompt 2), revise
      the `Diagnosis` block in the run `notes` — sharpen the root cause, tighten
      the minimal approach, add evidence — and fold each nit in as an edit.
      Resolve findings autonomously. The run snapshot is a council subject.
      After each revision, record the write with the witness writer:

        uv run "${CRUX_PLUGIN_ROOT}/scripts/run-work-witness.py" record <run-RUN-NNN.yaml> --prompt <n> --path <run-RUN-NNN.yaml>

      When every finding is resolved, commit the
      run snapshot and re-convene the council: run steps (a) to (d) of Prompt 2
      with the round number that step (d) defines, and attach the new council
      record to this prompt with `--artifacts`. The council runner commits the
      attempt record and the council record itself; handle its exit as Prompt 2
      directs. Its preflight refusals count at this prompt, toward the same bound
      of three. The module close reads every recorded round. A finding
      an edit answers stays blocking until a later round converges without it.
      When Prompt 2's gate passed, no blocking finding is left: record that and
      advance. After a third round that did not converge, advance to module close with the record
      attached; the gate check stops the run there at stop 1.
    expected_output: |
      Updated `Diagnosis`; a new council record attached when a round ran.
    side_effects: []

  - n: 4
    title: "Verify: commit to the approach"
    module_tag: verify-1
    purpose: |
      Record the verified root cause + chosen approach (the no-ADR durable why).
    prompt: |
      For a formal ID, pass --implementation-revision <decision-path> on this
      ordinal-four successful advance. The latest deciding council must itself
      retain that exact revision. Only advance appends binding with DONE; commit
      it before consumers. Approval establishes intent, never delivery or current state.
      Before logging, advance this prompt with the latest council record of this
      module in `--artifacts`. A `pass` verdict allows `--outcome done`. Otherwise
      advance with `--outcome blocked`: a `route` verdict returns the run to the
      address-findings prompt, and a `stop` verdict keeps the run here for the
      user. Convene a round here only when this module has no council record,
      because its council ran before council records existed.

      Invoke `log-work` with a reflective `decision`/`learning` journal entry:
      the root cause, the chosen minimal approach, why it's right, and any
      council debate. Reference this run. Name at least one non-obvious thing the
      reproduction/council surfaced. This commits the cycle to the approach; the
      dev module implements it next, reading the `Diagnosis` + this entry.
    expected_output: |
      A new `decision`/`learning` entry in `docs/journal/YYYY-MM.md`; the
      deciding council record attached.
    side_effects: [log-work]

  # --- Dev module #1 (4 prompts) — from cycle-module-dev.yaml, module_tag dev-1 ---
  # {RULE_REFS} is substituted with "the verified Diagnosis (run notes) + the
  # verify module's commit-approach journal entry" (an iterate cycle has no ADR).
  - n: 5
    title: "Develop: derive an implementation plan from the verified approach"
    module_tag: dev-1
    purpose: |
      Convert the verified diagnosis + approach into ordered work units.
    prompt: |
      Read governing architectural constraints and any selected formal implementation reasoning
      separately. An Implementation Decision supplies no rule or current-state authority.
      For a selected formal decision, compare delivery to the approved original and include annotations in
      independent review scope. Report approval, delivery and queried source state separately.
      Validate the committed approval binding and its retained context before
      treating reasoning as reviewed intent. Use the context's supported profile;
      book format supplies none. Preserve historical context bytes.
      Read the verified approach: the `Diagnosis` block in this run's `notes` +
      the verify module's commit-approach journal entry (an iterate cycle has no
      ADR — this is the `{RULE_REFS}` substitute). Produce an implementation plan:
      files to create/modify (paths); ordered work units (each ≤ ~200 LOC,
      independently testable); implementation-specific risks; quality gates
      (tests, linters, static analysis, security, `verify-code-docs`). Capture
      the plan in this run snapshot's `notes`. Keep the change MINIMAL — the
      council approved a fix, not a refactor.
    expected_output: |
      Implementation plan in this run's `notes`; clear ordered work units.
    side_effects: []

  - n: 6
    title: "Develop: spawn implementation team"
    module_tag: dev-1
    purpose: |
      Implement the plan with parallel agents where independent.
    prompt: |
      Read governing architectural constraints and any selected formal implementation reasoning
      separately. An Implementation Decision supplies no rule or current-state authority.
      For a selected formal decision, compare delivery to the approved original and include annotations in
      independent review scope. Report approval, delivery and queried source state separately.
      Validate the committed approval binding and its retained context before
      treating reasoning as reviewed intent. Use the context's supported profile;
      book format supplies none. Preserve historical context bytes.
      Group the Prompt 5 work units by independence. Dispatch one `Agent` per
      independent group; each receives the diagnosis, the plan, its work units,
      and `docs/AGENTS.md` conventions.

      Each agent also receives the book's `goal` statements — the Outcome, the
      Evidence, and the Constraint. A dispatch passes them forward verbatim, or
      narrows the Outcome and says so: a narrowed Outcome is entailed by its
      parent and names the parent it narrowed and what it dropped. The Evidence
      and the Constraint pass whole — a dispatch may add an Evidence item or a
      Constraint, saying which it added, and may drop neither. Record any
      narrowing in this run snapshot's Notes under the label `Outcome narrowing`
      — never by editing the book.

      Each agent makes actual edits, adds/updates tests, and reports files
      changed + test results + any unilateral decisions. Integrate; reconcile
      overlaps. Stay within the approved minimal scope.

      Integrate commits only outside the tester's window. The tester's window runs
      from the tester's dispatch until the tester returns. The agent that dispatched
      the tester holds the window. While it is open, that agent commits nothing to the main checkout, convenes no council, runs no live-tree tool, and dispatches no agent that does. Every dispatch you make while the window is open says so. The run has one commit
      lane: no commit and no council while the tester's full suite or a live-tree
      tool (compile-doctrine.py, summarize-adrs.py, derive-arch.py,
      run-drift-gates.py, the council runner) runs.
    expected_output: |
      All work units implemented; per-agent reports collected.
    side_effects: []

  - n: 7
    title: "Develop: run quality gates; loop until clean"
    module_tag: dev-1
    purpose: |
