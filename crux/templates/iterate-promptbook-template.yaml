      For a selected formal decision, compare delivery to the approved original and include annotations in
      independent review scope. Report approval, delivery and queried source state separately.
      Validate the committed approval binding and its retained context before
      treating reasoning as reviewed intent. Use the context's supported profile;
      book format supplies none. Preserve historical context bytes.
      Run, in order, and RECORD each in the run `notes` with its exact command +
      a concrete result token (e.g. `unittest → 149 OK`, `validate-catalog --dry-run
      → exit 0`), NOT a bare "all green": the test suite; the linter/
      formatter; static analysis; security analysis; `verify-code-docs`; and — if
      the diff touches any distributed surface (`crux/skills/`, `crux/agents/`,
      `crux/templates/`) — the **release-content scan** `check-public-release-content.py`
      (the permanent release-content scan) so a banned internal-reference leak fails
      IN-CYCLE, not only at release time. Read its exit code as a gate: exit 0 = clean; **exit 1 =
      FINDINGS** (one `<path>:<lineno>: <line>` row per hit on stdout — a real gate
      failure to FIX by re-editing, NOT an environment error); a crash / exit ≥ 2 /
      non-zero with empty or unparseable stdout = an environment-capability error
      (surface stderr; a distinct lane). Fix any
      failure (re-edit), then re-run the failed gate AND every subsequent gate.
      After 3 full loops without convergence, STOP and escalate.

      The run's designated tester runs the full suite. No agent other than the
      tester or the dev-lead starts a full suite, and one full suite runs at a time.
      The historian records the Tester record in the run notes under `Tester
      record`: gate label, command, HEAD, clean-tree status at start and end, result
      tokens and wall time. The quality-gate run carries the gate label `--gate
      <book-id>/<run-id>/p<N>/quality-gate`. Gate labels come from the closed set
      `integration`, `quality-gate`, `exit`. `<book-id>` is the book's `id` field
      (for example `PB-0144`), and `<run-id>` is the run's `run_id` (for example
      `RUN-001`). A cycle run labels its integration run `quality-gate`. `exit` labels the full suite at the
      exit gate before merge is offered. `integration` labels an integration full
      suite in a book that has no quality-gate prompt. Per-unit runs pass no
      `--gate` and are never reusable. Before re-running a gate's full suite, the
      tester may pass `--reuse` with that gate's label: the full-suite runner
      reports the matching record and starts no second run, and otherwise runs the
      suites. A record for another gate never matches `--reuse` for this one. A project whose full-suite runner takes no `--gate` or
      `--reuse` option still names the gate label in the Tester record and runs the
      suite each time. While the tester's full suite or a live-tree tool runs, no
      agent commits and no council convenes.
    expected_output: |
