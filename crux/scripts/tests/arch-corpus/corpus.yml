  # ── ruby ──────────────────────────────────────────────────────────────────
  - name: rubygems-org
    pack: ruby
    url: https://github.com/rubygems/rubygems.org
    sha: 2abc82667d02ef7ae3a1433d621c1f7463985c6d
    license: MIT
    why: >-
      The RubyGems registry: a large production Rails application with a
      404-line `config/routes.rb`, a `db/schema.rb` and NO `db/structure.sql`,
      and a full Zeitwerk `app/` tree. (This line read "a db/structure.sql (not
      schema.rb)" until U-R3 checked the pinned SHA and found the opposite. The
      retracted filename is left un-backticked on purpose — see this file's
      header, "THE BACKTICK CONVENTION". ADR-0067 does not carry the error, so
      no erratum is owed.)
    expect:
      pack: ruby
      packages: []
      concerns:
        data-model:
          populated: {min_entities: 463}
        api-surface:
          populated: {min_entities: 218}
          because: >-
            Two counting bases exist here and every figure below names the one
            it belongs to. A RENDERED ROW is a printed table row; a DISTINCT
            TRIPLE is a distinct `(method, path, controller)`. The renderer does
            not deduplicate, so the two totals differ, and no sum below mixes
            them.

            Measured from the two goldens. The pre-cycle golden held 381
            rendered rows, 355 distinct triples, 26 duplicate rows. This golden
            holds 218 rendered rows, 216 distinct triples, 2 duplicate rows, and
            `min_entities: 218` is the rendered count. Between them the distinct
            set moved by 263 removed, 124 added, 92 unchanged, which closes:
            355 - 263 + 124 = 216. Those five numbers are the whole measured
            diff; nothing else in this note is stated as a delta between the two
            goldens, because nothing else can be separated out of them — the
            cycle changed three things at once and their effects overlap row by
            row.

            What the removals are. The replaced reader was a line scan that
            OVER-counted, in two ways. It could not read an option list it did
            not see on the declaration's own line — a `%i[...]` word array, or
            an `only:` written on the next line — so it applied no filter and
            printed the full REST set for a resource that declares a few
            actions. Separately it read `only: []` as an empty filter and an
            empty filter as "no filter", so a declaration exposing ZERO REST
            actions also printed the full set. Five declarations are in that
            second class, and their phantom rows are countable from
            `config/routes.rb` itself rather than from the golden diff:
            `resources :rubygems, param: :name, only: []` (L14) at 8 rows,
            `resource :activity, only: []` (L100) at 7, `resource
            :webauthn_verification, only: []` twice (L246 and L327) at 7 each,
            and `resources :users, only: [] do get 'avatar', on: :member end`
            (L336) at 8 phantom rows beside the one route it really declares,
            `/users/:id/avatar`. That is 8 + 7 + 7 + 7 + 8 = 37 phantom rendered
            rows. The rendered total did not fall by 37 on account of them: for
            `rubygems` and `users` a sibling declaration of the same resource
            (L80 and L281) re-supplies some of those rows once its own option
            list is read correctly, which is why the two classes cannot be
            separated in the diff.

            The 2 surviving duplicate rows are an already-known residual, not a
            new defect. Each is a pair of DISTINCT declarations whose `path:` or
            `param:` rename this reader does not apply, so two real routes
            collapse onto one row. `get "/news" => 'news#show'` (L199) and
            `resource :news, path: 'releases', only: [:show]` (L200) both print
            `/news`, where the second really serves /releases. `resources
            :api_key_roles, param: :token` (L187) and its
            `only: %i[show], constraints: { format: :json }` twin (L192) both
            print `/profile/oidc/api_key_roles/:id`, where both are really
            `:token`.

            What the count still under-states is named in the file it renders:
            `root`, `mount`ed engines, `path:`/`param:`/`controller:` renames,
            and a `scope` whose path is a symbol or a `path:` keyword.
            `arch-inputs/routes.txt` is the input that closes all of them, and
            this repository is a shallow clone at a pinned SHA that cannot gain
            one.
        module-graph:
          populated: {min_entities: 619}
        decision-index:
          stubbed: {reason: precondition_missing}
          because: >-
            A surface the repository does not have — no crux documentation tree,
            so no ADR index to project.

