# Expected extraction for 01-actor.swift, written from the source before the
# extractor ran on it. The schema is shared by every NN-*.expected.yml here and
# is checked by test_swift_pack.FixtureFactsTests, which compares each listed
# section as an exact set against the rendered spine files:
#
#   types:             [{name, kind, access, at: [a, b], conditional}]      data-model ## Types
#   stored_properties: [{owner, name, type, access, at: [a, b]}]            data-model ## Stored properties
#   relationships:     [{from, relation, to, at: [a, b]}]                   data-model ## Relationships
#   interfaces:        [{name, kind, access, at: [a, b], attributes, conditional}]  api-surface ## Interfaces
#   requirements:      [{protocol, name, kind, at: [a, b]}]                 api-surface ## Protocol requirements
#   mains:             [{type, kind, at: [a, b]}]                           api-surface ## @main declarations
#   imports:           [{module, kind, line}]                               module-graph ## Imports
#   residuals:         [{concern, class, lines, detail}]                    each concern's ## Residuals
#
# `at` is [declaration start line, name token line], both 1-based. `type` null
# renders `—`; `attributes` [] renders `—`; `conditional` false renders `—`.
# `lines` is the bullet's range text ("4-25" or "4-4, 9-9"), or null for `lines —`.
# `detail` is the bullet's text after ` — `. A section absent from a file is
# not checked; an empty list asserts the rendered section has no row.
types:
