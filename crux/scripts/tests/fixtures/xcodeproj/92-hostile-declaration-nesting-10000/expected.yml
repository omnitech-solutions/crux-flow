# ADR-0129 clause 2 hostile form: declaration nesting is bounded at 64
# levels (`_MAX_DECLARATION_NESTING` in swift.py). A file nesting `struct A {`
# 10,000 deep (generated here, never committed) renders its first 64 levels
# and one `scan-cap` line in each concern, and no concern file grows with the
# square of the depth. Without the bound, the qualified names would make
# data-model.md about 100 MB.
materialize:
  - path: Sources/Nest/Deep.swift
    kind: repeated
    head: "struct A {\n"
    tail: "}\n"
    count: 10000

exit_code: 0

max_bytes:
  data-model: 200000
  api-surface: 200000
  module-graph: 200000

rows:
  data-model:
    - "| `A` | struct | internal | `Sources/Nest/Deep.swift:1-1` | — |"
    - "| `A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A.A` | struct | internal | `Sources/Nest/Deep.swift:64-64` | — |"

absent:
  data-model:
    - "`Sources/Nest/Deep.swift:65-65`"

residuals:
  - class: scan-cap
    path: Sources/Nest/Deep.swift
    kind: declaration nesting passes 64 levels; declarations nested deeper do not render
    count: 3
