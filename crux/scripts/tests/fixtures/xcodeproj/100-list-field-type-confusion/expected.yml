# ADR-0130 clauses 2 and 14 hostile form: the eleven list
# fields the Xcode reader reads -- `targets`, `packageReferences`,
# `children`, `dependencies`, `explicitFolders`, `exceptions`,
# `membershipExceptions`, `files`, `packageProductDependencies`,
# `buildPhases` and `fileSystemSynchronizedGroups` -- each holding a value
# that is not a list. The grammar parses every one, so none is `malformed`.
# Each renders exactly one `unsupported-project-form` at the field's own
# line with a fixed detail that echoes no value, and nothing is read from
# it: a string's characters are never ids or paths, and a dictionary's keys
# are never ids. So `targets = "TQ"` and `targets = { T = x; }` draw no
# target row for the real target `T`, `packageReferences = "RX"` draws no
# dependency row for the real reference `R`, `buildPhases = "SP"` reaches
# no real Sources phase `S`, `packageProductDependencies = "PQ"` draws no
# product row for the real product dependency `P`, and
# `membershipExceptions = "x."` adds nothing to `Other` (read per
# character, `.` named the whole root, `Explicit/Hidden2.swift` included).
# A non-list `exceptions` or `explicitFolders` applies nothing, so the
# root's default rows stand: `Src/D/a.swift` is a member of `Folders`.
#
# An item inside a list that is not a string keeps item-level handling,
# one line per item, and the project continues: in an id list (`targets`,
# `packageReferences`, `children`, `buildPhases`, `exceptions`, `files`) it
# renders `unresolved-reference`; in a path list (`explicitFolders`,
# `membershipExceptions`) it renders `unsupported-project-form`, and is not
# applied. Each of these items raised `TypeError` or `AttributeError` and
# collapsed the whole project to `project-unreadable`/`malformed`.
exit_code: 0

