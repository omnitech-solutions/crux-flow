# ADR-0130 clause 3: a project nested at ios/App.xcodeproj folder-syncs a
# root named "Shared" -- resolved against the PROJECT'S OWN directory
# (ios/), never the checkout root. A root-level decoy at Shared/Foo.swift
# must never be treated as a member; only ios/Shared/Foo.swift may render.
exit_code: 0

rows:
  module-graph:
    - "| `ios/Shared/Foo.swift` | `App` | folder-synced root ios/Shared | — |"

absent:
  module-graph:
    - "| `Shared/Foo.swift` |"
