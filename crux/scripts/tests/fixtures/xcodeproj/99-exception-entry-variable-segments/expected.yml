# ADR-0130 clauses 3 and 9 (a build-setting segment is never resolved): a
# folder-synced exception entry that names a build-setting reference --
# `$(X)`, `${X}` or bare `$X` -- is classified as a whole before the
# absolute-path test, the lexical join, the `/Localized/<dir>/<name>` split
# and any prune or filesystem call. Each such entry renders one
# `unresolved-reference` at its list-item line with a fixed detail naming no
# path and no variable, and changes no membership: a following `..` never
# cancels the reference. Built from fixture 21.
#
# - EXC_APP (the root's owner): `<ref>/../Excluded.swift` would, joined
#   lexically, exclude the real `AppSrc/Excluded.swift`. It stays a default
#   folder-synced member of `App`. The two `/Localized/` forms cover the
#   reference in `<name>` (it would exclude `Resources/en.lproj/Localized.swift`)
#   and in `<dir>` (it would render "resolves to no file"). The entries are
#   also keys of `platformFiltersByRelativePath`; no `conditional-setting`
#   line is written for them.
# - EXC_OTHER (a non-owner): `<ref>/../Owned.swift` would add a row for
#   `Other`. It adds nothing. `Other/Added.swift` is the control: a plain
#   entry in the same set still adds its row.
exit_code: 0

rows:
  module-graph:
    - "| `AppSrc/Owned.swift` | `App` | folder-synced root AppSrc | — |"
    - "| `AppSrc/Excluded.swift` | `App` | folder-synced root AppSrc | — |"
    - "| `AppSrc/Other/Added.swift` | `App` | folder-synced root AppSrc | — |"
    - "| `AppSrc/Other/Added.swift` | `Other` | added by an exception set | — |"

absent:
  module-graph:
    - "| `AppSrc/Excluded.swift` | `App` | excluded by an exception set"
    - "| `AppSrc/Owned.swift` | `Other` |"
    - "Localized.swift"
    - "$(X)"
    - "${X}"
    - "$X"
    - "path-escape"
    - "resolves to no file"
    - "conditional-setting"
    - "| `AppSrc/Assets.xcassets/Hidden.swift`"
    - "| `AppSrc/Explicit/Hidden2.swift`"

residuals:
  - class: unresolved-reference
    path: App.xcodeproj/project.pbxproj
    kind: an exception entry names a build-setting reference; it is never resolved and changes no membership
    count: 12
  - class: unresolved-reference
    path: App.xcodeproj/project.pbxproj
    kind: an exception entry names a build-setting reference; it is never resolved and changes no membership
    first_line: 60
    last_line: 60
  - class: unresolved-reference
    path: App.xcodeproj/project.pbxproj
    kind: an exception entry names a build-setting reference; it is never resolved and changes no membership
    first_line: 88
    last_line: 88
