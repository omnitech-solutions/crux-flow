# ADR-0130 clause 6 form, end to end: a `PBXTargetDependency` reaching a
# target in ANOTHER project through a `PBXContainerItemProxy`. The proxy's
# `containerPortal` names the file reference `Lib.xcodeproj` in App's main
# group; that project is a contained container the walk reached, and
# `remoteGlobalIDString` names a native target in it, so App draws an edge
# to `Lib (Lib.xcodeproj)`. No Swift import joins the two targets, so the
# proxy is the only route to that edge. A second proxy into the same
# project names a group there, not a native target, and renders one
# `unresolved-reference`.
exit_code: 0

rows:
  module-graph:
    - "| `App` | `App.xcodeproj` | app | application | — |"
    - "| `Lib` | `Lib.xcodeproj` | library | framework | — |"
    - "  App_xcodeproj__App[\"App (App.xcodeproj)\"] --> Lib_xcodeproj__Lib[\"Lib (Lib.xcodeproj)\"]"

residuals:
  - class: unresolved-reference
    path: App.xcodeproj/project.pbxproj
    kind: "dependency of 'App' does not resolve"
    count: 1
  - class: unresolved-reference
    path: App.xcodeproj/project.pbxproj
    kind: "dependency of 'App' does not resolve"
    first_line: 71
    last_line: 75
