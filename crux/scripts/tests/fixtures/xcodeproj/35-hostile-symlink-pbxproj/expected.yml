# ADR-0130 clause 17 hostile form: `project.pbxproj` materialized as a
# symlink -- refused as `project-unreadable` / `not-regular` at the safe-
# read boundary (`_safe_read_bytes` in crux/scripts/crux/arch/core.py),
# never followed. Swift entities elsewhere in the tree still render.
materialize:
  - path: App.xcodeproj/project.pbxproj
    kind: symlink
    target: ../../Real/somewhere.txt

exit_code: 0

rows:
  data-model:
    - "| `Model` | struct | public |"

residuals:
  - class: project-unreadable
    path: App.xcodeproj/project.pbxproj
    kind: "not-regular"
    first_line: null
    last_line: null
