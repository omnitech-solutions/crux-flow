# ADR-0129:151 and :150 (fixture D-byname): a by-name product whose only
# `.package(path:)` was refused as pruned has no local-package candidate.
# It renders the "resolves to 0 containers" line and draws no edge; the
# decoy `Other` declaring the same name is never searched.
materialize:
  - path: Pods/CorePkg/Package.swift
    kind: repeated
    head: "let package = Package(name: \"CorePkg\", products: [.library(name: \"CoreKit\", targets: [\"CoreKit\"])], targets: [.target(name: \"CoreKit\")])\n"
    count: 1

exit_code: 0

rows:
  module-graph:
    - "| `AppCore` | `App/Package.swift` | library"
    - "| `CoreKit` | `Other/Package.swift` | library"

absent:
  module-graph:
    - "-->"
    - "path dependency"
    - "CorePkg"
    - "Pods"
    - "was refused"
    - "Other_Package_swift__CoreKit"

residuals:
  - class: unresolved-reference
    path: App/Package.swift
    kind: a `.package(path:)` reference names a directory the Swift walk skips; no dependency row renders
    first_line: 5
    last_line: 5
    count: 2
  - class: unresolved-reference
    path: App/Package.swift
    kind: product CoreKit of target AppCore resolves to 0 containers; no edge is drawn
    first_line: 8
    last_line: 8
    count: 1
